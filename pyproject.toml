[project]
name = "dr-code"
version = "0.1.0"
description = "Compression–correctness evaluation harness for HumanEval+ decoder attempts"
readme = "README.md"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0,<4",
    "marimo[recommended]>=0.23.10",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "typer>=0.26.7",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# code_eval is absorbed source (composable migration stage 3), not a dep;
# its subprocess normalizers now run against the dev ruff (>=0.15.18), as
# dr-code already did via its former override-dependencies pin.
[tool.hatch.build.targets.wheel]
packages = ["src/dr_code", "src/code_eval"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "ty>=0.0.51",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
include = ["scripts/**/*.py", "src/**/*.py"]
line-length = 79

[tool.ty.src]
include = ["scripts", "src"]
# src/code_eval is absorbed legacy source (type-checked under its own
# lineage config); it gets slimmed/retyped in the profile-v2 steps.
exclude = ["nbs", "tests", "src/code_eval"]
