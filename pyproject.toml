[project]
name = "dr-code"
version = "0.1.0"
description = "Producer-blind Python code evaluation toolkit with HumanEval+ execution and synthetic corruption datasets"
readme = "README.md"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0,<4",
    "dr-serialize>=0.1.0",
    "duckdb>=1.5.5",
    "fastapi>=0.139.2",
    "pyarrow>=20",
    "pydantic>=2.13.4",
    "typer>=0.26.7",
    "uvicorn[standard]>=0.51.0",
    "zstandard>=0.25.0",
]

[project.scripts]
dr-code = "dr_code.viewer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_code"]

[dependency-groups]
dev = [
    "filelock>=3.29.4",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.18",
    "ty>=0.0.51",
]

[tool.pytest.ini_options]
addopts = "-n auto --maxprocesses=4 --dist=worksteal"
testpaths = ["tests"]
[tool.ruff]
include = ["scripts/**/*.py", "src/**/*.py"]
line-length = 79

[tool.ty.src]
include = ["scripts", "src"]
exclude = ["nbs", "tests"]
