[project]
name = "dr-code"
version = "0.1.0"
description = "Producer-blind Python code evaluation toolkit with HumanEval+ execution and synthetic corruption datasets"
readme = "README.md"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0,<4",
    "pydantic>=2.13.4",
    "typer>=0.26.7",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_code"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "ty>=0.0.51",
]

# Development mode: every component is pinned at initial-version while
# semantics are in flux. This marker is read only by repository contract
# tests (tests/test_component_versioning.py); production code never imports
# or branches on it, and it never appears in persisted artifacts. Development
# mode ends at the first tagged release, at which point this table is removed
# and real per-component versioning begins.
[tool.dr-code.component-versioning]
development-mode = true
initial-version = "0"

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
include = ["scripts/**/*.py", "src/**/*.py", "tests/**/*.py"]
line-length = 79

[tool.ty.src]
include = ["scripts", "src"]
exclude = ["nbs", "tests"]
