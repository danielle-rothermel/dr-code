[project]
name = "dr-code"
version = "0.1.0"
description = "Producer-blind Python code evaluation toolkit with HumanEval+ execution and synthetic corruption datasets"
readme = "README.md"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0,<4",
    "pydantic>=2.13.4",
    "typer>=0.26.7",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_code"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "ty>=0.0.51",
]

# Development mode pins every component to initial-version. Only repository
# contract tests read this marker; runtime code does not, and persisted
# artifacts do not record it.
[tool.dr-code.component-versioning]
development-mode = true
initial-version = "0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test directories carry no package markers, so mirrored basenames
# (tests/metrics/test_definition.py, tests/preprocessing/test_definition.py)
# need importlib import mode rather than sys.path insertion.
addopts = "--import-mode=importlib"
markers = [
    "oci: requires the opt-in live Docker sandbox runtime and pinned image",
]

[tool.ruff]
include = ["scripts/**/*.py", "src/**/*.py", "tests/**/*.py"]
line-length = 79

[tool.ty.src]
include = ["scripts", "src"]
exclude = ["nbs", "tests"]
