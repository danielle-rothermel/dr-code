[project]
name = "dr-code-workspace"
version = "0.2.0"
description = "dr-code monorepo workspace"
readme = "README.md"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "dr-code",
    "matplotlib>=3.10.8",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.18",
    "ty>=0.0.51",
]
addons = [
    "drc-generation-corpus",
    "drc-humaneval",
    "drc-synthetic",
]

[tool.uv]
required-version = ">=0.12.0"
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dr-code = { workspace = true }
drc-generation-corpus = { workspace = true }
drc-humaneval = { workspace = true }
drc-synthetic = { workspace = true }

[tool.dr-code.component-versioning]
development-mode = true
initial-version = "0"

[tool.ruff]
include = [
    "packages/**/src/**/*.py",
    "packages/**/tests/**/*.py",
    "scripts/**/*.py",
]
line-length = 79

[tool.ty.src]
include = ["packages/*/src", "scripts"]
exclude = ["nbs"]

[tool.ty.environment]
extra-paths = ["packages/dr-code/src"]
