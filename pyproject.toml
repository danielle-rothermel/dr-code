[project]
name = "dr-code"
version = "0.2.0"
description = "Producer-blind Python code evaluation toolkit with HumanEval+ execution and synthetic corruption datasets"
readme = "README.md"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0,<4",
    "dr-serialize==0.1.0",
    "duckdb>=1.5.5",
    "fastapi>=0.139.2",
    "pyarrow>=23.0.1",
    "pydantic>=2.13.4",
    "typer>=0.26.7",
    "uvicorn[standard]>=0.51.0",
    "zstandard>=0.25.0",
]

[project.scripts]
dr-code = "dr_code.viewer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_code"]
exclude = [
    "/src/dr_code/viewer/prebuilt_viewer_assets.sha256",
    "/src/dr_code/viewer/prebuilt_viewer_assets.tar.gz",
    "/src/dr_code/viewer/static",
]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
skip-excluded-dirs = true
include = [
    "/.gitignore",
    "/.python-version",
    "/CHANGELOG.md",
    "/docs",
    "/LICENSE",
    "/README.md",
    "/hatch_build.py",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
    "/uv.lock",
    "/viewer",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "ty>=0.0.51",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
include = ["scripts/**/*.py", "src/**/*.py", "tests/**/*.py"]
line-length = 79

[tool.ty.src]
include = ["scripts", "src"]
exclude = ["nbs", "tests"]
