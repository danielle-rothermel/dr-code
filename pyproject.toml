[project]
name = "dr-code"
version = "0.1.3"
description = "Python code preparation and evaluation toolkit with HumanEval+ execution and synthetic corruption datasets"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0,<4",
    "dr-exec==0.1.4",
    "dr-serialize==0.1.2",
    "dr-store==0.1.4",
    "pydantic>=2.13.4",
    "typer>=0.26.7",
    "zstandard>=0.25.0",
]

[project.urls]
Repository = "https://github.com/danielle-rothermel/dr-code"
Issues = "https://github.com/danielle-rothermel/dr-code/issues"
Documentation = "https://danielle-rothermel.github.io/dr-code/"
Changelog = "https://github.com/danielle-rothermel/dr-code/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_code"]

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "ty>=0.0.51",
]

[tool.uv]
required-version = "==0.11.25"

# Development mode pins every component to initial-version. Only repository
# contract tests read this marker; runtime code does not, and persisted
# artifacts do not record it.
[tool.dr-code.component-versioning]
development-mode = true
initial-version = "0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test directories carry no package markers, so mirrored basenames
# (tests/metrics/test_definition.py, tests/preprocessing/test_definition.py)
# need importlib import mode rather than sys.path insertion.
addopts = "--import-mode=importlib"

[tool.ruff]
include = ["scripts/**/*.py", "src/**/*.py", "tests/**/*.py"]
line-length = 79

[tool.ty.src]
include = ["scripts", "src"]
exclude = ["nbs", "tests"]
