name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: viewer/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml
      - name: Verify packaged viewer assets match source
        run: >-
          uv run --no-project --python 3.13 python
          scripts/build_viewer_assets.py --check
      - run: uv sync --locked
      - name: Smoke-test clean-source viewer startup
        run: |
          test ! -e src/dr_code/viewer/static
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from dr_code.viewer.app import create_app

          class Service:
              def list_runs(self):
                  return ()

          client = TestClient(
              create_app(Service()), base_url="http://127.0.0.1"
          )
          response = client.get("/")
          assert response.status_code == 200
          assert 'id="root"' in response.text
          PY
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest
      - run: pnpm install --frozen-lockfile
        working-directory: viewer
      - run: pnpm typecheck
        working-directory: viewer
      - run: pnpm build
        working-directory: viewer
      - run: pnpm test
        working-directory: viewer
      - run: pnpm --filter @dr-code/preprocessing-analysis exec playwright install --with-deps chromium
        working-directory: viewer
      - run: pnpm test:e2e
        working-directory: viewer
