name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - name: Run default Python tests
        run: uv run pytest -m "not oci"
      - name: Preload shared immutable OCI Python sandbox image
        run: docker pull "$DR_CODE_SANDBOX_IMAGE"
        env:
          DR_CODE_SANDBOX_IMAGE: python:3.13.14-slim@sha256:eb43ff125d8d58d7449dcba7d336c23bcac412f526d861db493b9994d8010280
      - name: Run OCI sandbox tests
        run: uv run pytest -m oci
        env:
          DR_CODE_RUN_SANDBOX_TESTS: "1"
          DR_CODE_SANDBOX_IMAGE: python:3.13.14-slim@sha256:eb43ff125d8d58d7449dcba7d336c23bcac412f526d861db493b9994d8010280
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: viewer/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: viewer
      - run: pnpm typecheck
        working-directory: viewer
      - run: pnpm build
        working-directory: viewer
      - run: pnpm test
        working-directory: viewer
