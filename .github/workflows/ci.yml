name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.13"
      # NOTE: fails on today's main. [tool.uv.sources] pins code-eval,
      # dr-providers, and dr-queues to local paths (../code-eval, ...) that do
      # not exist in a CI checkout, and `--no-sources` cannot resolve either
      # (PyPI's `code-eval` is an unrelated package with no 0.2.0 release).
      # Goes green once PR #9 removes the path deps.
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
