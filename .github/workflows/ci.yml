name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: depot-ubuntu-24.04
    steps:
      # The dr-exec local path source in pyproject.toml is
      # ``../../repos/dr-exec`` relative to the dr-code checkout. Both repos
      # are checked out into that same two-level layout so the one relative
      # literal resolves identically here and in the local worktree. This
      # cross-repo checkout and its credential are removed at the pin-swap
      # commit; until then it is a validation item.
      - uses: actions/checkout@v7
        with:
          path: worktrees/dr-code-cutover
      - uses: actions/checkout@v7
        with:
          repository: danielle-rothermel/dr-exec
          path: repos/dr-exec
          ref: main
      - uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: worktrees/dr-code-cutover/viewer/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: worktrees/dr-code-cutover/viewer/pnpm-lock.yaml
      - run: uv sync --locked
        working-directory: worktrees/dr-code-cutover
      - name: Smoke-test clean-source viewer startup
        working-directory: worktrees/dr-code-cutover
        run: |
          test ! -e src/dr_code/viewer/static
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from dr_code.viewer.app import create_app

          class Service:
              def list_runs(self):
                  return ()

          client = TestClient(
              create_app(Service()), base_url="http://127.0.0.1"
          )
          response = client.get("/")
          assert response.status_code == 200
          assert 'id="root"' in response.text
          PY
      - run: uv run ruff format --check .
        working-directory: worktrees/dr-code-cutover
      - run: uv run ruff check .
        working-directory: worktrees/dr-code-cutover
      - run: uv run ty check
        working-directory: worktrees/dr-code-cutover
      - run: uv run pytest
        working-directory: worktrees/dr-code-cutover
      - run: pnpm install --frozen-lockfile
        working-directory: worktrees/dr-code-cutover/viewer
      - run: pnpm typecheck
        working-directory: worktrees/dr-code-cutover/viewer
      - run: pnpm build
        working-directory: worktrees/dr-code-cutover/viewer
      - run: pnpm test
        working-directory: worktrees/dr-code-cutover/viewer
      - run: pnpm --filter @dr-code/preprocessing-analysis exec playwright install --with-deps chromium
        working-directory: worktrees/dr-code-cutover/viewer
      - run: pnpm test:e2e
        working-directory: worktrees/dr-code-cutover/viewer
