<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code-eval extraction ladder</title>
<style>
:root { color-scheme: light; --bg:#f7f8fa; --surface:#fff; --muted:#6b7280; --text:#111827; --line:#e5e7eb; --line2:#d1d5db; --raw:#2563eb; --norm:#7c3aed; --good:#15803d; --bad:#b42318; --soft:#f3f4f6; --accent:#4f46e5; --accent-soft:#eef2ff; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
button, input { font:inherit; }
.shell { width:min(1500px, 100%); margin:0 auto; padding:20px; }
.topbar, .panel, .metric, .inspector { background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
.topbar { position:sticky; top:0; z-index:3; display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px 16px; margin-bottom:16px; }
h1 { margin:0 10px 0 0; font-size:16px; }
button, input { border:1px solid var(--line2); border-radius:8px; background:var(--surface); color:var(--text); padding:7px 10px; }
button { cursor:pointer; }
button:hover { background:var(--soft); }
.pill { color:var(--muted); background:var(--soft); border-radius:999px; padding:4px 8px; font-size:12px; }
.meta { padding:12px 16px; margin-bottom:12px; color:var(--muted); }
.meta b { color:var(--text); }
.metrics { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:10px; margin-bottom:12px; }
.metric { padding:10px; }
.metric span { display:block; color:var(--muted); font-size:12px; }
.metric b { font-size:20px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
.panel { min-width:0; }
.panel h2 { margin:0; padding:12px 14px; border-bottom:1px solid var(--line); font-size:13px; }
.panel-body { padding:12px; }
pre { margin:0; white-space:pre-wrap; overflow:auto; font:12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.input-pre { max-height:32vh; }
.ladder { display:grid; gap:8px; }
.row { display:grid; grid-template-columns:160px 1fr 1fr; gap:8px; }
.head { color:var(--muted); font-weight:600; }
.name { color:var(--muted); padding:10px 4px; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
.cell { border:1px dashed var(--line2); border-radius:10px; padding:8px; min-height:54px; }
.cell.raw { border-left:3px solid var(--raw); }
.cell.norm { border-left:3px solid var(--norm); }
.candidate { display:block; width:100%; text-align:left; margin:0 0 7px; border:1px solid var(--bad); border-radius:10px; background:var(--surface); padding:8px; }
.candidate.valid { border-color:var(--good); }
.candidate.selected { outline:2px solid var(--accent); background:var(--accent-soft); }
.candidate b { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
.snip { color:var(--muted); overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
.empty { color:var(--muted); font-style:italic; padding:4px; }
.inspector { position:sticky; bottom:0; margin-top:12px; padding:12px; }
.inspector h2 { margin:0 0 8px; font-size:13px; }
#inspect { max-height:38vh; }
@media (max-width: 900px) { .grid, .metrics, .row { grid-template-columns:1fr; } .topbar { position:static; } }
</style>
</head>
<body>
<script id="ladder-data" type="application/json">__EXTRACTION_LADDER_JSON__</script>
<div class="shell">
  <header class="topbar">
    <h1>code-eval extraction ladder</h1>
    <button id="prev">Prev</button>
    <button id="next">Next</button>
    <label>Index <input id="jump" type="number" min="0" style="width:90px"></label>
    <label>Filter <input id="filter" placeholder="candidate text, validator, task..."></label>
    <button id="copy">Copy summary</button>
    <span id="where" class="pill"></span>
  </header>
  <section class="panel meta" id="meta"></section>
  <section class="metrics" id="metrics"></section>
  <section class="grid">
    <div class="panel"><h2>Raw output</h2><div class="panel-body"><pre class="input-pre" id="raw"></pre></div></div>
    <div class="panel"><h2>Text-normalized output</h2><div class="panel-body"><pre class="input-pre" id="norm"></pre></div></div>
  </section>
  <section class="panel">
    <h2>First-round extractors</h2>
    <div class="panel-body">
      <div class="row head"><div></div><div>Raw input</div><div>Normalized input</div></div>
      <div class="ladder" id="ladder"></div>
    </div>
  </section>
  <section class="inspector">
    <h2>Selected snippet</h2>
    <pre id="inspect">Select a candidate.</pre>
  </section>
</div>
<script>
const DATA = JSON.parse(document.getElementById('ladder-data').textContent);
const state = { i: 0, selected: null, filter: '' };
const samples = DATA.samples || [];
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const active = () => samples[state.i];
function setIndex(i) { state.i = Math.max(0, Math.min(samples.length - 1, i)); state.selected = null; render(); }
function visible(candidate) {
  if (!state.filter) return true;
  const q = state.filter.toLowerCase();
  return JSON.stringify(candidate).toLowerCase().includes(q) || JSON.stringify(active()).toLowerCase().includes(q);
}
function metric(label, value) { return `<div class="metric"><span>${esc(label)}</span><b>${esc(value)}</b></div>`; }
function candidateButton(candidate, row, side) {
  if (!visible(candidate)) return '';
  const cls = `candidate ${candidate.is_valid_before_repair ? 'valid' : ''} ${state.selected === candidate.id ? 'selected' : ''}`;
  return `<button class="${cls}" data-row="${row}" data-side="${side}" data-id="${esc(candidate.id)}"><b>${esc(candidate.id)}</b><div>${candidate.char_count} chars · ${candidate.is_valid_before_repair ? 'valid' : 'invalid'}</div><div class="snip">${esc(candidate.source)}</div></button>`;
}
function cell(candidates, row, side, cls, error) {
  const html = candidates.map(candidate => candidateButton(candidate, row, side)).join('');
  const empty = error ? esc(error) : 'no output';
  return `<div class="cell ${cls}">${html || `<div class="empty">${empty}</div>`}</div>`;
}
function render() {
  if (!samples.length) { $('meta').textContent = 'No samples.'; return; }
  const sample = active();
  $('where').textContent = `${state.i + 1} / ${samples.length}`;
  $('jump').value = state.i;
  $('meta').innerHTML = `<b>${esc(sample.task_id)}</b> · sample ${esc(sample.sample_id)} · entry ${esc(sample.entry_point)} · source ${esc(sample.source)} · occurrence ${esc(sample.occurrence_count)}<br>${esc(DATA.meta.source_attempts_path)} · generated ${esc(DATA.meta.generated_at)}`;
  $('metrics').innerHTML = metric('raw candidates', sample.summary.raw_candidate_count) + metric('normalized candidates', sample.summary.normalized_candidate_count) + metric('valid before repair', sample.summary.valid_before_repair_total_count) + metric('empty extractors', sample.summary.empty_extractor_count) + metric('normalized changed', sample.input.normalized_changed ? 'yes' : 'no');
  $('raw').textContent = sample.input.raw_output;
  $('norm').textContent = sample.input.normalized_output;
  $('ladder').innerHTML = sample.passes.map((row, idx) => `<div class="row"><div class="name">${esc(row.extractor)}</div>${cell(row.raw_candidates, idx, 'raw_candidates', 'raw', row.raw_error)}${cell(row.normalized_candidates, idx, 'normalized_candidates', 'norm', row.normalized_error)}</div>`).join('');
  document.querySelectorAll('.candidate').forEach(button => {
    button.onclick = () => {
      const row = sample.passes[Number(button.dataset.row)];
      const candidate = row[button.dataset.side].find(item => item.id === button.dataset.id);
      state.selected = candidate.id;
      $('inspect').textContent = JSON.stringify(candidate, null, 2);
      render();
    };
  });
  if (!state.selected) $('inspect').textContent = 'Select a candidate.';
}
$('prev').onclick = () => setIndex(state.i - 1);
$('next').onclick = () => setIndex(state.i + 1);
$('jump').onchange = event => setIndex(Number(event.target.value));
$('filter').oninput = event => { state.filter = event.target.value; render(); };
$('copy').onclick = async () => navigator.clipboard.writeText(JSON.stringify(active().summary, null, 2));
render();
</script>
</body>
</html>
