# Binding contracts for dr-code. Statements are present-tense standing rules;
# rationale records why each rule exists.

[[contracts]]
title = "Development components use the initial version"
statement = """
While development mode is enabled, every registered preprocessing step,
metric operator, preprocessing definition, HumanEval profile and override
set, synthetic corruption, and synthetic recipe uses the configured initial
version."""
rationale = """
Component coordinates already persist. Independently chosen pre-experiment
versions would imply compatibility distinctions that the repository does not
yet support."""
date = "2026-08-05"
check = "uv run pytest tests/test_component_versioning.py"

[[contracts]]
title = "Releases come from validated immutable main commits"
statement = """
PyPI publication requires a version-matching release tag whose commit belongs
to main, an isolated smoke test of the installed wheel, and access to the
release-tag-only PyPI environment. Only the configured release actor creates
release tags, and an existing release tag cannot be updated or deleted."""
rationale = """
Passing validation establishes build quality but not repository approval.
Main ancestry retains the pull-request boundary, installed-wheel execution
checks the artifact that is uploaded, and the environment and tag restrictions
keep publication from bypassing or changing that provenance."""
date = "2026-08-06"
check = "uv build && uv run python scripts/check_built_wheel.py"

[[contracts]]
title = "Core depends on no functional package"
statement = """
dr_code.core owns shared models, source operations, and execution mechanisms
and imports no functional package."""
rationale = """
Benchmark and measurement policy depend on reusable infrastructure; allowing
that dependency to reverse would make shared mechanisms domain-specific."""
date = "2026-08-05"
check = "uv run pytest tests/core/test_package_layout.py"

[[contracts]]
title = "Traces are complete defensive evidence"
statement = """
Every trace is immutable self-describing evidence that contains input and
output, accepts only typed artifacts or explicit absences, records a validated
producer, and exposes only projections that cannot mutate its stored snapshot."""
rationale = """
Missing wiring must remain distinguishable from failed computation, and
caller mutation must not rewrite evidence after capture."""
date = "2026-08-09"
check = "uv run pytest tests/trace/test_trace.py tests/trace/test_facts.py"

[[contracts]]
title = "Persisted evidence is self-describing"
statement = """
Serialized traces and metric records carry fixed schema versions and their
resolved producer, definition, component, question, and settings identity;
restoration does not consult current component registries."""
rationale = """
Recorded evidence must remain interpretable after registries or accepted
settings change. Resolving persisted identity through live registries would
make history depend on current code."""
date = "2026-08-09"
check = "uv run pytest tests/trace/test_serialization.py tests/metrics/records/test_record_wire_format.py"

[[contracts]]
title = "Preprocessing validates composition before execution"
statement = """
Binding validates step identity, settings, instance-name uniqueness, and
artifact-kind wiring before any input runs; declared step failures produce
explicit absences in a complete trace, while unexpected exceptions escape
unchanged."""
rationale = """
Configuration defects are wiring errors, declared candidate failures are
recorded as evidence, and infrastructure defects must not be mislabeled as
candidate outcomes."""
date = "2026-08-09"
check = "uv run pytest tests/preprocessing/test_definition.py tests/preprocessing/test_runner.py tests/preprocessing/steps/test_conformance.py"

[[contracts]]
title = "Metric outcomes are explicit records"
statement = """
Metric extraction returns one discriminated metric record per declared
question: a measured record with non-empty unique finite metric values, a
not-applicable record carrying the causal absence, or an operator-failure
record carrying failure type and message."""
rationale = """
Zero, inapplicability, and computation failure have different meanings and
cannot share a sentinel without corrupting downstream interpretation."""
date = "2026-08-09"
check = "uv run pytest tests/metrics/test_definition.py tests/metrics/records tests/metrics/engine"

[[contracts]]
title = "Evaluation plans are internally complete"
statement = """
An evaluation plan nests its complete preprocessing and metrics definitions,
covers exactly its selected tasks with its sampling plan, and aggregates only a
question declared by its metrics definition. The sampling plan declares a
sample count per selected task, so a plan whose tasks carry unequal sample
counts still declares exactly the slots its tasks occupy and never more."""
rationale = """
A persisted plan remains interpretable as one coherent declaration rather
than a set of references resolved against mutable registries. Per-task sample
counts keep declared membership equal to real membership, so a plan cannot
declare slots that no member can ever fill."""
date = "2026-08-05"
check = "uv run pytest tests/evaluation/test_plan.py tests/evaluation/test_wire_format.py"

[[contracts]]
title = "Aggregation is deterministic over explicit slots"
statement = """
Aggregation is registry-free and deterministic over its explicit input slots
and returns an evaluation projection that reports missing input, policy
refusal, an empty denominator, and non-finite computation as distinct typed
results."""
rationale = """
Exceptional outcomes are evaluation data, not ambiguous numbers or incidental
exceptions. Classifying the result as a projection keeps the metric records
from which it derives authoritative."""
date = "2026-08-09"
check = "uv run pytest tests/evaluation/test_aggregation.py"

[[contracts]]
title = "HumanEval projections preserve failure attribution"
statement = """
A HumanEval submission result is a benchmark projection derived from sample
evaluation records. Candidate-attributable outcomes remain candidate execution
evidence; trusted support-code initialization failures and malformed runner
results remain harness or operator failures rather than candidate failures.
Every scoring profile declares its candidate reduction, and the projection
reduces candidates only as declared. Each reduction also fixes the rule applied
within one candidate, whose evaluation runs the complete suite once per
top-level function: first-candidate scores candidate zero alone and requires
every one of its function groups to pass; any-candidate-passes scores a pass
when any candidate's validated metric slice has any function group passing the
complete test-case set, so a helper extracted beside a correct solution cannot
mask it. Under any reduction that reads more than one candidate, an unmeasured
candidate is a harness or operator failure rather than a measured zero, because
a candidate whose measurement broke might have passed; likewise a candidate
whose groups did not finish is reported as timed out rather than as a measured
failure.
Batch scoring returns one result per submission in request order;
single-submission scoring is the one-item convenience. Public scoring reads the
authoritative records and never invokes a second execution path."""
rationale = """
Incorrect or resource-exhausting candidate code is evidence about candidate
behavior; broken evaluation infrastructure invalidates the measurement.
Keeping results derivable prevents a score envelope from replacing the complete
execution record. Declaring the reduction on the profile keeps the reduction a
named, versioned part of the scoring identity rather than a wired-in default
that silently decides what a recorded score means."""
date = "2026-08-09"
check = "uv run pytest tests/humaneval/test_projection.py tests/humaneval/test_metric_operator.py"

[[contracts]]
title = "Synthetic coordinates determine sample identity"
statement = """
A synthetic evaluation sample is deterministic for its HumanEval task,
registered recipe coordinate, and generation seed; an altered or unregistered
recipe cannot claim the same identity."""
rationale = """
Recorded identities, not ambient registry state, make datasets reproducible."""
date = "2026-08-09"
check = "uv run pytest tests/synthetic/test_dataset_builder.py tests/synthetic/test_corruption_recipes.py tests/synthetic/test_corruptions.py"

[[contracts]]
title = "Candidate execution jobs are bounded and outcome mapping is closed"
statement = """
Every candidate execution job declares finite wall-clock, input, and
payload-output budgets and a fixed environment grant, and production executor
construction requires an explicit Python executable. Trusted non-candidate
jobs may run unbudgeted. The library supplies the output-retention half of
that budget: 512 MiB per stream head and a 1 GiB payload-output bound, with
the two heads always summing to the payload-output bound. Wall time and input
bytes carry no default and every caller names them. Overflow keeps failing the
job, which yields a retained typed outcome rather than voided evidence.
Exited, signaled, wall-time, and payload-output outcomes have fixed mappings;
payload-owned protocol failures map to candidate-attributable kills; every
other outcome fails closed as an executor failure. Candidate execution records
preserve this closed interpretation."""
rationale = """
Evaluating model-produced source remains an adversarial boundary. Under
dr-exec the subprocess retains the invoking worker's permissions and worker
isolation is the deployment boundary, so bounded budgets and one closed
mapping are what keep candidate execution records separate from broken
infrastructure. Retention defaults live in the library because a failing
candidate's evidence is what later reflection reads, and it should survive by
default rather than because one script happened to name a bound; wall time and
input size stay explicit because only the caller knows its workload."""
date = "2026-08-09"
check = "uv run pytest tests/humaneval/test_candidate_job.py tests/evaluation/test_candidate_execution.py"

[[contracts]]
title = "Parallel preprocessing runs on the dr-exec worker pool"
statement = """
`preprocess_batch` and `candidate_sources_batch` deduplicate requested texts and
run each distinct text once as one trusted importable JSON job on a dr-exec
worker pool, which imports the preprocessing entry point once per worker. A
completion that does not carry one valid result is that text's failure and never
aborts unrelated inputs. Without an observer every result is returned keyed by
text; with an observer each result is handed over as it completes and nothing is
retained. A caller that consumes candidate sources runs the candidate-sources
entry point, which returns the sources alone rather than the trace carrying
them. `evaluate_batch` sample prepare uses the trace path; the eligible-corpus
stage uses the candidate-sources path. Batches run unbudgeted unless a caller
declares a per-item wall-time budget; a text killed on that budget is that
text's failure like any other and is additionally reported as a timeout."""
rationale = """
Preprocessing is trusted, CPU-bound, milliseconds-per-item work, so it needs
real cores without paying interpreter startup per item, and it makes no
containment claim. Streaming results to an observer keeps corpus-scale batches
from retaining every result. Result size is the throughput term that matters:
the caller decodes and validates every byte a worker returns, single-threaded,
so returning a whole serialized trace where only its sources are wanted costs
about two orders of magnitude in payload and collapses pool throughput to the
caller's parse rate no matter how many workers run. The wall-time budget is a
liveness guard, not a performance bound: trusted milliseconds-per-item work has
no principled runtime ceiling, so the library declares none and each workflow
sets a value far above any healthy input's cost, where a wedged worker would
otherwise stall a corpus-scale run indefinitely."""
date = "2026-08-11"
check = "uv run pytest tests/caching/test_preprocess_batch.py tests/evaluation/test_preprocess_prepare.py tests/preprocessing/test_job.py"

[[contracts]]
title = "Execution cache persistence is scoped and checkpointed"
statement = """
A persistent execution cache reads distinct request keys in bounded windows
that return an explicit hit or miss for every key, then serves point reads and
writes from a bounded memory window. Clean outcomes may be evicted after their
dependent records are assembled. Persistent keys include the opaque request
key, the full digest of a mandatory caller-owned runtime identity, and the
versioned execution-cache namespace. Strictly invalid records are observable
misses. One background writer keeps at most one bounded atomic batch in flight,
coalesces later outcomes within one bounded pending batch, and leaves additional
outcomes memory-only rather than growing persistence state. It attempts a final
checkpoint during normal close. A failed checkpoint remains observable but
never creates unbounded retry state or fails evaluation. The caller uses
persistent reuse only for workloads whose outcomes it treats as stable within
the runtime scope and coordinates one active writer for that scope."""
rationale = """
Bounded windows keep storage latency and total membership out of the execution
hot path without retaining every outcome in memory. Runtime scope prevents
reuse across ambient behavior changes, strict restoration prevents malformed
data from becoming evidence, and bounded best-effort checkpointing cannot turn
storage failure into memory growth or evaluation failure."""
date = "2026-08-09"
check = "uv run pytest tests/caching/test_execution_cache.py"

[[contracts]]
title = "Evaluation uses one bounded execution path"
statement = """
Every production code evaluation reaches execution through one dr-code path
over the dr-exec job and scheduling primitives. One job evaluates one
materialized candidate. A HumanEval job loads one candidate namespace once and
evaluates all ordered requested function/test groups there; multiple CodeTest
questions are ordered suites with per-suite settings under one finite aggregate
job budget. Multiple candidates or evaluation samples never share a job.
Standalone batches bound concurrency; durable application work invokes
candidate jobs serially within its bounded attempt partition without nesting
schedulers. Every job enforces finite budgets and a fixed environment
declaration, attributes outcomes to the named failure class, and retains
portable execution-record identity. This path is not an operating-system
sandbox."""
rationale = """
One execution boundary prevents script-specific process behavior and unbounded
concurrency while preserving named failure attribution."""
date = "2026-08-09"
check = "uv run pytest tests/humaneval/test_candidate_job.py tests/evaluation/test_candidate_execution.py tests/evaluation/test_batch.py"

[[contracts]]
title = "Run grade joins the candidate execution cache key"
statement = """
Every evaluation batch request declares its run grade explicitly, with no
default, and that grade joins the candidate execution cache key beside the
request identity and the budget dimensions. A trial outcome and a
selection-grade outcome for identical source therefore never collide and are
never served interchangeably. Grade is a key discriminator and its
configuration point only: it is not a cache-eviction rule, a policy engine, or
a second cache, and the runtime-identity half of the persistent key is
unchanged."""
rationale = """
A silent default would let exploratory outcomes serve deciding runs from the
same key, which is precisely the confusion the grade exists to prevent, and
requiring the caller to name the grade keeps the choice visible at every
entry point."""
date = "2026-08-12"
check = "uv run pytest tests/evaluation/test_candidate_execution.py"

[[contracts]]
title = "Only candidate-owned outcomes enter the execution cache"
statement = """
The execution cache holds outcomes that describe the candidate and no others.
A completed job and a candidate-owned termination are written and later reused;
a harness failure and an infrastructure failure are never written, so an
identical later request re-executes it. The decision reads the failure class
derived from the typed outcome and adds no second vocabulary. An evaluation
batch request may additionally declare itself fresh, which skips cache lookup
for that request's generations so every candidate re-executes and the fresh
outcome is the one recorded and offered to persistence. Persisted bindings are
append-only and first-writer-wins, so fresh bypasses lookup without replacing
an entry already stored under the same key, and a later non-fresh request for
that key reads the original binding. dr-code decides cacheability and provides
the fresh switch; it never re-attempts a request on its own."""
rationale = """
Caching a run-owned failure replays an environment fault to every later reader
as though the candidate had produced it, which is the one thing attribution
exists to prevent, and a caller who wants a deliberate re-run needs a way to
say so that does not depend on guessing key structure."""
date = "2026-08-12"
check = "uv run pytest tests/evaluation/test_cache_policy.py"

[[contracts]]
title = "Failure attribution is a named three-way class"
statement = """
Failure attribution travels as the closed vocabulary harness, candidate, and
infrastructure, derived once from the typed candidate execution outcome. A
completed job attributes no failure class. Candidate termination is
candidate-owned, a harness execution failure is harness-owned, and an executor
execution failure is infrastructure-owned. Exception-type strings stay in the
failure cause they describe and never stand in for the class."""
rationale = """
The union arms already separate the three owners structurally; naming them
gives the shared attribution channel typed domain values that survive
serialization instead of a free-form string that only a reader can interpret."""
date = "2026-08-12"
check = "uv run pytest tests/evaluation/test_candidate_execution.py tests/humaneval/test_projection_wire_format.py"

[[contracts]]
title = "Evaluation batches bound resident and aggregate work"
statement = """
Every evaluation request declares finite attempt, processing-window, and shard
limits. Attempt limits cover ordered membership, materialized candidates,
admitted jobs, retained evidence bytes, and requested projection rows. The
materialized-candidate limit counts all candidates; the admitted-job limit
counts cache misses actually submitted to or run by an executor. Known
violations fail before admission. Work discovered after admission proceeds
through bounded windows and shards; reaching a limit stops new admission and
yields a partial invalid evaluation attempt record without attributing the
limit to candidate behavior. Pending jobs, full cache outcomes, record
assembly, and projection rows do not remain resident in proportion to total
membership beyond the compact identities and references required for
authoritative ordering."""
rationale = """
Finite per-job budgets and execution concurrency do not bound aggregate work or
memory. Explicit attempt limits and bounded windows keep a reusable primitive
safe when applications evaluate large memberships."""
date = "2026-08-09"
check = "uv run pytest tests/evaluation/test_batch_limits.py tests/evaluation/test_resident_bounds.py"

[[contracts]]
title = "Evaluation attempt records are authoritative"
statement = """
An evaluation attempt record preserves the versioned evidence and ordered
membership needed for interpretation. Each projection names its source record
and versioned definition and is deterministic given both and a supported
implementation. Projections neither replace evidence nor supply identity absent
from the source record. They retain identities, measurements, and portable
evidence references without repeating raw input, trace, candidate, request, or
execution-output payloads."""
rationale = """
Projections intentionally discard structure. Keeping them derivable prevents
publication formats from becoming lossy domain contracts without embedding
executable algorithms or supporting every historical version indefinitely."""
date = "2026-08-09"
check = "uv run pytest tests/evaluation/test_record_wire_format.py tests/evaluation/test_projections.py"

[[contracts]]
title = "Evaluation bundles are portable and closed"
statement = """
Every evaluation bundle uses the released dr-store artifact-bundle integrity
envelope, with an evaluation format marker, closed versioned dr-code manifest,
and versioned artifact schemas. One bundle publishes one bounded evaluation
attempt, never one evaluation sample, candidate execution, or durable member
operation. The manifest identifies the authoritative attempt record and
included projections through portable references without machine-specific
absolute paths. Bundle-local evidence and reference indexes use declared
bounded shards. Attempt records use explicit closed variants for bundle-local
artifact references and content-addressed stored-record references; readers
never infer a reference kind from byte size, path, or availability. Readers
validate the bundle envelope and each selected artifact's schema and source
binding, rejecting unknown fields and unsupported versions. Each projection
carries its own source-attempt binding because released selective artifact
reads do not expose the manifest payload. Restoration bounds reference counts
and sequential ObjectStore reads and validates closed schemas after decode; it
does not claim a pre-decode byte, depth, or allocation bound that released
ObjectStore reads do not provide. Restoration verifies evidence while consuming
it rather than first performing a separate full audit. Restoring or auditing an
attempt validates the full record; reading one projection does not."""
rationale = """
The storage envelope proves byte integrity and completeness, not evaluation
meaning; versioned domain schemas and portable references make restored
artifacts interpretable without eager full-record reads."""
date = "2026-08-09"
check = "uv run pytest tests/evaluation/test_bundle_wire_format.py tests/evaluation/test_bundle_reading.py tests/evaluation/test_bundle_audit.py"

[[contracts]]
title = "Evaluation replay preserves provenance"
statement = """
Replay names its source attempt record and selects sample or
materialized-candidate mode. Sample replay requires frozen samples and support
for the recorded preprocessing definition. Candidate replay requires ordered
candidates in a supported schema and bypasses rather than reproduces
preprocessing. A successful replay creates a new immutable attempt record with
its current runtime identity, cache scope, and candidate execution records; it
never changes or fills its source. Unsupported source evidence remains
inspectable; replay preflight returns a typed unavailable result and creates no
new attempt record. Malformed or internally inconsistent source evidence is a
validation error."""
rationale = """
Explicit source, mode, and current context distinguish re-execution from result
reuse without requiring legacy implementation or environment archives."""
date = "2026-08-09"
check = "uv run pytest tests/evaluation/test_replay.py"

[[contracts]]
title = "Structural comparison matches semantic identities"
statement = """
Structural comparison aligns records by evaluation slot, evaluation sample,
preprocessing definition, and evaluation candidate identity. It reports
matched, added, and removed identities; ordering changes; and exact changed or
unchanged status for samples, traces, ordered candidates, and metric records.
Each supported projection comparison reports its population and available
denominator. It accepts compact attempt records plus an injected evidence
resolver, short-circuits equal references or content hashes, and resolves only
matched changed evidence needed for the comparison.
Unsupported or mismatched projection definitions and versions produce a typed
not-comparable result. Field-level diffs and arbitrary projection comparison
are not required."""
rationale = """
Position, identity, and content can change independently. Identity-aware
alignment and explicit denominators expose those differences without turning
the core into a general diff or analysis engine."""
date = "2026-08-09"
check = "uv run pytest tests/evaluation/test_comparison.py"

[[contracts]]
title = "Evaluation identity distinguishes plans from samples"
statement = """
An evaluation slot identifies only one planned task-and-sample position,
addressed by its task id and its sample index within that task. An
evaluation sample separately carries the stable identity and provenance of the
realized raw input bound to that slot. An evaluation candidate identity
composes the evaluation sample identity, the complete resolved preprocessing
definition identity, and the candidate's ordered position after
materialization. Raw content, source content, and their hashes never substitute
for any of those semantic identities."""
rationale = """
Planned membership, realized inputs, and materialized candidate occurrences
answer different attribution questions. Explicit composition supports live
generation and frozen corpora without guessing identity from equal content or
ambient ordering."""
date = "2026-08-09"
check = "uv run pytest tests/evaluation/test_identity.py tests/evaluation/test_record_models.py"

[[contracts]]
title = "Work keys derive from configuration and slot addressing coordinates"
statement = """
A work key is the content-addressed digest of one experiment configuration
hash together with one evaluation slot's full addressing coordinates: its task
set coordinate, its sampling plan coordinate, its task id, and its sample
index, over an explicit payload of pinned literal keys. The derivation is a
pure function with no storage and no registry, so the same configuration
addresses the same work under the same task set and sampling plan
coordinates."""
rationale = """
Deriving the key from what a slot actually carries keeps it computable from
one slot without a lookup, and pinning the payload keys as literals keeps
stored identity from drifting when model field names change."""
date = "2026-08-12"
check = "uv run pytest tests/evaluation/test_work_key.py"

[[contracts]]
title = "Candidate execution records preserve execution provenance"
statement = """
Each evaluated materialized candidate produces a record binding its evaluation
candidate identity, request, runtime identity, cache scope, interpreted dr-exec
outcome, and optional portable run-record reference. The record identifies the
outcome as executed or reused. A reused outcome references its source candidate
execution record and never claims a new process execution. Metric records and
projections do not replace it."""
rationale = """
Scores omit what ran, under which context, and how outcomes were attributed.
The execution record preserves those bindings independently of projections
without duplicating referenced data."""
date = "2026-08-09"
check = "uv run pytest tests/evaluation/test_candidate_execution.py tests/caching/test_execution_cache.py"

[[contracts]]
title = "Every selected input has a sample evaluation record"
statement = """
An evaluation attempt record accounts for every ordered evaluation slot and
selected evaluation sample with one sample evaluation record. That record
composes sample metadata with a complete preprocessing trace whose required
input is the one authoritative persisted occurrence of the selected raw input,
plus the ordered materialized candidates, metric records, and candidate
execution records that exist for it. Zero-candidate, declared absence,
not-applicable, candidate-failure, operator-failure, harness-failure, and
executor-failure outcomes remain distinct nested records under one sample
terminal record, including when outcomes are mixed; they neither collapse into
one lossy sample status nor disappear from the attempt record."""
rationale = """
Flattening only successful measurements silently changes membership and
denominators. Complete typed records retain attribution through every expected
and exceptional evaluation outcome."""
date = "2026-08-09"
check = "uv run pytest tests/evaluation/test_record_models.py tests/evaluation/test_batch.py"

[[contracts]]
title = "Evaluation attempt completeness and validity are explicit"
statement = """
An evaluation attempt record separately reports whether every declared member
reached a typed terminal record and whether the attempt is valid evaluation
evidence. Candidate-attributable failure, zero candidates, and declared
inapplicability do not by themselves make a complete attempt invalid. An
explicit infrastructure or operator failure completes its affected terminal
record but marks the evaluation attempt invalid; an interrupted member without
a terminal record makes the attempt partial and invalid. Publication may
preserve partial or invalid evidence but never presents it as a valid completed
evaluation."""
rationale = """
Evidence can be complete about a failed evaluation without supporting a score.
Separating completeness, validity, and candidate behavior prevents missing work
or broken infrastructure from being counted as experimental outcomes."""
date = "2026-08-09"
check = "uv run pytest tests/evaluation/test_record_models.py tests/evaluation/test_batch_limits.py"

[[contracts]]
title = "Cancellation is not an evaluation outcome"
statement = """
Cancellation propagates without being translated into a terminal evaluation
record. A dr-exec CancelledOutcome becomes asyncio.CancelledError and never
becomes evidence. Already persisted member records may later contribute to a
partial evaluation attempt record, but standalone cancellation does not
guarantee terminal evaluation bundle publication."""
rationale = """
Cancellation is caller and scheduler control flow, not candidate behavior or
evaluation evidence. Translating it would misattribute interrupted work;
requiring synchronous terminal publication would add lifecycle machinery not
owned by the evaluation core."""
date = "2026-08-09"
check = "uv run pytest tests/evaluation/test_candidate_execution.py -k cancellation"

[[contracts]]
title = "Execution composition preserves interpretation"
statement = """
The evaluation batch applies one evaluation model to one caller-selected
bounded partition of explicit ordered membership. Grouping multiple attempts
and their fan-in remain application policy. Standalone batches and separately
recovered durable work use the same rules for evaluation sample and evaluation
candidate identity, metric meaning, ordering, denominators, and failure
attribution. Each attempt records the operational context needed to interpret
its outcomes. Concurrency, cache reuse, partitioning, retry, and recovery may
change candidate behavior and derived results; execution composition does not
guarantee deterministic outcomes."""
rationale = """
Execution placement is operational policy, but candidate code may depend on
time, randomness, environment, or contention. Preserving interpretation keeps
local and durable evidence comparable without requiring deterministic
execution."""
date = "2026-08-09"
check = "uv run pytest tests/evaluation/test_batch.py tests/evaluation/test_durable_partition.py"

[[contracts]]
title = "Evaluation core excludes experiment and workflow policy"
statement = """
The evaluation core accepts selected samples or frozen candidates and owns
preprocessing, candidate materialization, execution interpretation, metrics,
evaluation records, projections, replay, and structural comparison.
Model-provider and prompt work, experiment membership and acceptance,
statistical analysis, and durable workflow scheduling and fan-in remain
outside the core. Application and workflow adapters invoke the same boundary."""
rationale = """
Keeping provider, optimizer, statistical, and scheduling policy with existing
owners preserves reusable evaluation semantics and prevents another experiment
framework."""
date = "2026-08-09"
check = "uv run pytest tests/core/test_package_layout.py"

[[contracts]]
title = "Generation corpus evidence keeps its natural grain"
statement = """
A generation corpus stores nonblank final generation outputs separately from
source lifecycle records and standalone encoder artifact records, gives every
generation record exactly one request provenance record and one content-addressed
task record, and resolves encoder lineage only through an explicit persisted
source reference. Aggregate migration attempt counts remain raw evidence and do
not create retry or attempt identities."""
rationale = """
Collapsing incomplete records, encoder outputs, generation records, or task
versions into one row grain invents joins and corrupts analysis denominators;
derived retry identities similarly overstate flattened historical evidence."""
date = "2026-08-08"
check = "uv run pytest tests/generation_corpus"

[[contracts]]
title = "Evidence writes join the caller's transaction"
statement = """
dr-code persists at two grades. Cache-grade writes are fail-open: the windowed
execution cache checkpoints outcomes best-effort, and a failed checkpoint never
fails evaluation. Evidence-grade writes are transaction-participating: an
explicit evaluation entry point accepts the caller's open sync SQLAlchemy Core
connection and writes the member sample records, the attempt record, and the
output_reference binding through dr-store's enlisted operations on that
connection. It never commits, rolls back, or closes the connection it is
handed, so the evidence becomes visible exactly when the caller commits and
leaves nothing behind when the caller rolls back. The generation artifact
bundle publishes before the enlisted writes, so a committed output_reference
always names an already-published artifact. When no connection is supplied the
best-effort publication path is unchanged."""
rationale = """
Reusable execution outcomes are an optimization whose loss costs only time,
while evidence is the record a later analysis reads: partially visible evidence
would misstate what ran. Joining the caller's transaction makes the records and
the reference that resolves them commit as one unit without dr-code owning a
transaction it did not open, and publishing the artifact first keeps a
committed reference from naming an artifact that does not exist."""
date = "2026-08-12"
check = "uv run pytest tests/evaluation/test_evidence.py"
