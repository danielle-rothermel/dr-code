part_of = ["generation corpus"]

[[terms]]
name = "task adapter"
definition = """
A dataset-specific boundary that resolves persisted task identities to exact,
content-addressed task material stored as task records."""
exported_symbols = ["dr_code.generation_corpus.tasks.base.TaskAdapter"]
categories = ["generation corpus"]
part_of = ["generation corpus"]

[[terms]]
name = "generation record"
definition = """
The persisted corpus row for one generation's final output at decoder stage.
It stores generation output and provenance; code candidates are extracted
