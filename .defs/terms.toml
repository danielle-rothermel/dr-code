[[terms]]
name = "task"
definition = """
A single dataset element identified by a task id and carrying the original
prompt, ground truth code, and test suite needed to score generations."""
categories = ["experiment design"]

[[terms]]
name = "original prompt"
definition = """
The code generation prompt provided by the dataset or derived from related
fields the dataset provides."""
categories = ["experiment design"]
part_of = ["task"]

[[terms]]
name = "ground truth code"
definition = """
A single example of correct code that should match the original prompt and
pass the task test suite."""
categories = ["experiment design"]
part_of = ["task"]

[[terms]]
name = "test suite"
definition = """
The set of test cases that should pass against any code that is correct for
one task."""
categories = ["experiment design"]
part_of = ["task"]

[[terms]]
name = "sample"
definition = """
One fresh generation for a given task. In an encoder-decoder setup this is one
full encode-decode run. It is distinct from an evaluation sample unless an
adapter explicitly binds them."""
categories = ["experiment design"]

[[terms]]
name = "num samples"
definition = """
The number of samples planned or observed per task."""
categories = ["experiment design"]

[[terms]]
name = "sample index"
definition = """
The zero-based position of one sample among a task's num samples."""
categories = ["experiment design"]
part_of = ["sample"]

[[terms]]
name = "task index"
definition = """
The position of one task among the full dataset, ordered according to the
dataset's defined canonical ordering."""
categories = ["experiment design"]
part_of = ["task"]

[[terms]]
name = "generation graph"
definition = """
The structure of the steps that convert task input into generation output to
be scored."""
categories = ["experiment design"]

[[terms]]
name = "direct generation"
definition = """
A generation graph that uses the original prompt as input and produces one
generation output."""
categories = ["experiment design"]
is_a = ["generation graph"]

[[terms]]
name = "encoder-decoder generation"
definition = """
A generation graph that encodes ground truth code into an intermediate
representation and decodes it back to generation output."""
categories = ["experiment design"]
is_a = ["generation graph"]

[[terms]]
name = "generation"
definition = """
One run of a generation graph for one task sample, producing generation output
that may later yield code candidates through preprocessing."""
categories = ["experiment design"]

[[terms]]
name = "generation index"
definition = """
