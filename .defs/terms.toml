[[terms]]
name = "generation corpus"
definition = """
A content-addressed collection of persisted model generations whose generation
records, source lifecycle records, standalone encoder artifact records, task
records, and request provenance records retain their distinct analytical
grains. These archival records are distinct from evaluation evidence until
re-evaluation binds them."""
exported_symbols = [
  "dr_code.generation_corpus.GenerationRecord",
  "dr_code.generation_corpus.SourceRecord",
  "dr_code.generation_corpus.EncoderArtifactRecord",
  "dr_code.generation_corpus.RequestRecord",
  "dr_code.generation_corpus.TaskRecord",
  "dr_code.generation_corpus.build_generation_corpus",
  "dr_code.generation_corpus.BuildManifest",
  "dr_code.generation_corpus.CorpusWriter",
]
categories = ["generation corpus"]

[[terms]]
name = "pool dump"
definition = """
An archived export of raw pool rows and its manifest, selected as the immutable
input to one generation-corpus build."""
exported_symbols = [
  "dr_code.generation_corpus.SourceManifest",
  "dr_code.generation_corpus.DumpedPoolRow",
  "dr_code.generation_corpus.read_manifest",
  "dr_code.generation_corpus.iter_pool_rows",
]
categories = ["generation corpus"]

[[terms]]
name = "generation corpus bundle"
definition = """
One atomically published generation-corpus directory: validated Parquet tables,
a build manifest, and content hashes for every artifact."""
exported_symbols = [
  "dr_code.generation_corpus.BuildManifest",
  "dr_code.generation_corpus.CorpusWriter",
  "dr_code.generation_corpus.build_generation_corpus",
]
categories = ["generation corpus"]
part_of = ["generation corpus"]

[[terms]]
name = "corpus adapter"
definition = """
A dataset-specific extraction boundary that maps one pool dump into validated
generation-corpus tables through a corpus adapter name and version recorded in
the build manifest."""
exported_symbols = ["dr_code.generation_corpus.adapters.base.CorpusAdapter"]
