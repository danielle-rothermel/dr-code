[project]
name = "drc-generation-corpus"
version = "0.1.0"
description = "Generation corpus extraction for dr-code"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "dr-code",
    "drc-humaneval",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drc_generation_corpus"]

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.uv.sources]
dr-code = { workspace = true }
drc-humaneval = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "generation_corpus: generation corpus extraction tests",
]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
line-length = 79
